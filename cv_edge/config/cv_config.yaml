camera:
  source: 0
  fps: 30
  width: 1280
  height: 720

shopper_model:
  path: models/shopper/yolov8n.onnx
  int8_path: models/shopper/yolov8n_int8.onnx
  prefer_int8: false
  confidence_threshold: 0.35
  iou_threshold: 0.45

shelf_model:
  path: models/shelf/shelf_detector.onnx
  int8_path: models/shelf/shelf_detector_int8.onnx
  mode: generic

entry_line:
  p1: [0.05, 0.50]
  p2: [0.95, 0.50]
  cooldown_sec: 2.0

queue_zones:
  - id: queue-counter-1
    name: "Cashier Counter 1"
    camera_id: "cam-02-checkout-1"
    polygon:
      - [0.35, 0.35]
      - [0.95, 0.35]
      - [0.95, 0.95]
      - [0.35, 0.95]
    warning_threshold: 4
    critical_threshold: 7
    seconds_per_shopper: 115.0

  - id: queue-counter-2
    name: "Cashier Counter 2"
    camera_id: "cam-03-checkout-2"
    polygon:
      - [0.05, 0.35]
      - [0.35, 0.35]
      - [0.35, 0.95]
      - [0.05, 0.95]
    warning_threshold: 4
    critical_threshold: 7
    seconds_per_shopper: 110.0

shelf_zones:
  - id: shelf-aisle-3-upper
    name: "Aisle 3 Upper Shelf (Dairy)"
    aisle: "Aisle 3"
    category: "Dairy & Milk"
    expected_count: 8
    low_stock_threshold_pct: 30.0
    out_of_stock_threshold_pct: 15.0
    roi: [0.10, 0.15, 0.90, 0.48]

  - id: shelf-aisle-3-lower
    name: "Aisle 3 Lower Shelf (Dairy)"
    aisle: "Aisle 3"
    category: "Dairy & Milk"
    expected_count: 10
    low_stock_threshold_pct: 30.0
    out_of_stock_threshold_pct: 15.0
    roi: [0.10, 0.52, 0.90, 0.88]

backend:
  url: "http://127.0.0.1:8000"
  sync_interval_sec: 1.5
